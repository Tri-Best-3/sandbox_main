# Windows 보안 이벤트 ID 4688(프로세스 생성)용 최소 Sigma 룰 (Sysmon 아님)
# 랜섬웨어가 자주 사용하는 섀도우 복사본 삭제 명령을 탐지
# 기본 Windows 보안 로그(Event ID 4688)를 대상으로 함
# 섀도우 복사본 삭제/수정에 쓰이는 대표 실행 파일을 감지
# `CommandLine|contains` 튜닝 및 예외 추가로 오탐 최소화 권장

# 사람이 읽기 쉬운 메타데이터
title: Win Ransomware Shadow Copy Deletion
# 룰 고유 식별자(UUID)
id: 11111111-1111-1111-1111-111111111111
# 룰 상태(예: stable, experimental)
status: stable
# 심각도(예: low, medium, high)
level: high
# 분류 태그
tags:
  - stage.a
  - status.stable
# 로그 소스 선택: Windows 프로세스 생성 이벤트
logsource:
# 운영체제 지정
  product: windows
# 이벤트 카테고리 지정
  category: process_creation
# 탐지 로직: 실행 파일 + 섀도우 복사본 삭제 키워드 매칭.
detection:
  # 매칭 조건 묶음
  selection:
    # Security 로그의 프로세스 생성 이벤트 ID (Sysmon 아님)
    EventID: 4688
    # 프로세스 실행 파일 경로가 아래 문자열로 끝나는지 확인
    NewProcessName|endswith:
      - "\\vssadmin.exe"
      - "\\wmic.exe"
      - "\\bcdedit.exe"
    # 명령줄에 아래 키워드가 포함되는지 확인
    CommandLine|contains:
      - "delete"
      - "shadows"
      - "shadowcopy"
  # vssadmin/wmic/bcdedit에 대한 구체적인 조합을 추가로 매칭
  selection_vssadmin:
    NewProcessName|endswith: "\\vssadmin.exe"
    CommandLine|contains:
      - "delete"
      - "shadows"
  selection_wmic:
    NewProcessName|endswith: "\\wmic.exe"
    CommandLine|contains:
      - "shadowcopy"
      - "delete"
  selection_bcdedit:
    NewProcessName|endswith: "\\bcdedit.exe"
    CommandLine|contains:
      - "bootstatuspolicy"
      - "ignoreallfailures"
  # 단순하게: 위 조건을 같은 이벤트에서 모두 만족해야 함
  condition: selection and (selection_vssadmin or selection_wmic or selection_bcdedit)
